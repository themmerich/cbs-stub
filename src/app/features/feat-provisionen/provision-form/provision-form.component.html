<form [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="flex flex-col h-full">
  <div class="flex-1 overflow-auto p-4 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <p-floatlabel variant="on" class="block">
        <p-datePicker appendTo="body" [showIcon]="true" formControlName="stichtag" id="stichtag" class="w-full"/>
        <label for="stichtag">Stichtag</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="kundennummer" id="kundennummer" autocomplete="off" class="w-full"/>
        <label for="kundennummer">Kundennummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vpProduktinfo1" id="vpProduktinfo1" autocomplete="off" class="w-full"/>
        <label for="vpProduktinfo1">VP Produktinfo 1</label>
      </p-floatlabel>

      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="kontonummer" id="kontonummer" autocomplete="off" class="w-full"/>
        <label for="kontonummer">Kontonummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="beraternummer" id="beraternummer" autocomplete="off" class="w-full"/>
        <label for="beraternummer">Beraternummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vpProduktinfo2" id="vpProduktinfo2" autocomplete="off" class="w-full"/>
        <label for="vpProduktinfo2">VP Produktinfo 2</label>
      </p-floatlabel>

      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="geschaeftsnummer" id="geschaeftsnummer" autocomplete="off" class="w-full"/>
        <label for="geschaeftsnummer">Geschäftsnummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <p-select appendTo="body" formControlName="neugeschaeft" id="neugeschaeft" optionLabel="name" [options]="neugeschaefte" class="w-full"/>
        <label for="neugeschaeft">Bestands-/Neugeschäft</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vpProduktinfo3" id="vpProduktinfo3" autocomplete="off" class="w-full"/>
        <label for="vpProduktinfo3">VP Produktinfo 3</label>
      </p-floatlabel>

      <p-floatlabel variant="on" class="block">
        <p-select appendTo="body" formControlName="erfassungsart" id="erfassungsart" optionLabel="name" [options]="erfassungsarten" class="w-full"/>
        <label for="erfassungsart">Erfassungsart</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vertriebsweg" id="vertriebsweg" autocomplete="off" class="w-full"/>
        <label for="vertriebsweg">Vertriebsweg</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vpProduktinfo4" id="vpProduktinfo4" autocomplete="off" class="w-full"/>
        <label for="vpProduktinfo4">VP Produktinfo 4</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-select appendTo="body" formControlName="bezeichnung" id="bezeichnung" optionLabel="name" [options]="bezeichnungen" class="w-full"/>
        <label for="bezeichnung">Provisionsbezeichnung</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <p-select appendTo="body" formControlName="waehrung" id="waehrung" optionLabel="name" [options]="waehrungen" class="w-full"/>
        <label for="waehrung">Währung</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="block">
        <input pInputText formControlName="vpProduktinfo5" id="vpProduktinfo5" autocomplete="off" class="w-full"/>
        <label for="vpProduktinfo5">VP Produktinfo 5</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="flex items-center justify-between gap-2 p-4">
    <!-- left button group -->
    <div class="flex items-center gap-2">
    </div>

    <!-- right button group -->
    <div class="flex items-center gap-2">
      <p-button label="Cancel" severity="secondary" type="button" (click)="onCancel()"></p-button>
      <p-button label="Save" type="submit" [disabled]="!(formGroup.dirty && formGroup.valid)"></p-button>
    </div>
  </div>
</form>
