<h1>Provisionen</h1>
<p-fieldset legend="Filterkriterien">
  <form [formGroup]="form" style="display: table; clear: both; width: 700px">
    <div style="float: left; width: 33.33%">
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="stichtag" id="stichtag" autocomplete="off"/>
        <label for="stichtag">Stichtag</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="kontonummer" id="kontonummer" autocomplete="off"/>
        <label for="kontonummer">Kontonummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="geschaeftsnummer" id="geschaeftsnummer" autocomplete="off"/>
        <label for="geschaeftsnummer">Geschäftsnummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="erfassungsart" id="erfassungsart" autocomplete="off"/>
        <label for="erfassungsart">Erfassungsart</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText formControlName="bezeichung" id="bezeichung" autocomplete="off"/>
        <label for="bezeichung">Provisionsbezeichnung</label>
      </p-floatlabel>
    </div>

    <div style="float: left; width: 33.33%">
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="kundennummer" id="kundennummer" autocomplete="off"/>
        <label for="kundennummer">Kundennummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="beraternummer" id="beraternummer" autocomplete="off"/>
        <label for="beraternummer">Beraternummer</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="neugeschaeft" id="neugeschaeft" autocomplete="off"/>
        <label for="neugeschaeft">Bestands-/Neugeschäft</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="vertriebsweg" id="vertriebsweg" autocomplete="off"/>
        <label for="vertriebsweg">Vertriebsweg</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText formControlName="waehrung" id="waehrung" autocomplete="off"/>
        <label for="waehrung">Währung</label>
      </p-floatlabel>
    </div>

    <div style="float: left; width: 33.33%">
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="vpProduktinfo1" id="vpProduktinfo1" autocomplete="off"/>
        <label for="vpProduktinfo1">VP Produktinfo 1</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="vpProduktinfo2" id="vpProduktinfo2" autocomplete="off"/>
        <label for="vpProduktinfo2">VP Produktinfo 2</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="vpProduktinfo3" id="vpProduktinfo3" autocomplete="off"/>
        <label for="vpProduktinfo3">VP Produktinfo 3</label>
      </p-floatlabel>
      <p-floatlabel variant="on" class="formField">
        <input pInputText formControlName="vpProduktinfo4" id="vpProduktinfo4" autocomplete="off"/>
        <label for="vpProduktinfo4">VP Produktinfo 4</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText formControlName="vpProduktinfo5" id="vpProduktinfo5" autocomplete="off"/>
        <label for="vpProduktinfo5">VP Produktinfo 5</label>
      </p-floatlabel>
    </div>
  </form>
</p-fieldset>

<p-fieldset legend="Filterergebnis">
  <p-toolbar>
    <ng-template #start>
      <p-button icon="pi pi-plus" class="mr-2" text severity="secondary" />
      <p-button icon="pi pi-print" class="mr-2" text severity="secondary" />
      <p-button icon="pi pi-upload" class="mr-2" text severity="secondary" />
    </ng-template>
  </p-toolbar>
  <ag-grid-angular
    style="width: 100%; height: 300px"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [theme]=themeBalham
    (gridReady)="onGridReady($event)"
    (rowDoubleClicked)="onRowDoubleClick($event)"
  />
</p-fieldset>
