<div>
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold">Provisionen</h1>
    @if (dark) {
      <p-button icon="pi pi-moon" severity="secondary" (onClick)="toggleDarkMode()"/>
    } @else {
      <p-button icon="pi pi-sun" severity="secondary" (onClick)="toggleDarkMode()"/>
    }
  </div>

  <p-fieldset legend="Filterkriterien">
    <form [formGroup]="form" style="width: 80%">
      <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end">
        <div class="w-full">
          <p-floatlabel variant="on" class="block mr-2">
            <p-select formControlName="stichtag" id="stichtag" optionLabel="name" [options]="stichtage" class="w-full"/>
            <label for="stichtag">Stichtag</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="kontonummer" id="kontonummer" autocomplete="off"/>
            <label for="kontonummer">Kontonummer</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="geschaeftsnummer" id="geschaeftsnummer" autocomplete="off"/>
            <label for="geschaeftsnummer">Geschäftsnummer</label>
          </p-floatlabel>
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="block mr-2">
            <p-select formControlName="erfassungsart" id="erfassungsart" optionLabel="name" [options]="erfassungsarten" class="w-full"/>
            <label for="erfassungsart">Erfassungsart</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2 mr-2">
            <p-select formControlName="bezeichung" id="bezeichung" optionLabel="name" [options]="bezeichnungen" class="w-full"/>
            <label for="bezeichung">Provisionsbezeichnung</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="kundennummer" id="kundennummer" autocomplete="off"/>
            <label for="kundennummer">Kundennummer</label>
          </p-floatlabel>
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="block">
            <input pInputText formControlName="beraternummer" id="beraternummer" autocomplete="off"/>
            <label for="beraternummer">Beraternummer</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2 mr-2">
            <p-select formControlName="neugeschaeft" id="neugeschaeft" optionLabel="name" [options]="neugeschaefte" class="w-full"/>
            <label for="neugeschaeft">Bestands-/Neugeschäft</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="vertriebsweg" id="vertriebsweg" autocomplete="off"/>
            <label for="vertriebsweg">Vertriebsweg</label>
          </p-floatlabel>
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="block mr-2">
            <p-select formControlName="waehrung" id="waehrung" optionLabel="name" [options]="waehrungen" class="w-full"/>
            <label for="waehrung">Währung</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="vpProduktinfo1" id="vpProduktinfo1" autocomplete="off"/>
            <label for="vpProduktinfo1">VP Produktinfo 1</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="vpProduktinfo2" id="vpProduktinfo2" autocomplete="off"/>
            <label for="vpProduktinfo2">VP Produktinfo 2</label>
          </p-floatlabel>
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="block">
            <input pInputText formControlName="vpProduktinfo3" id="vpProduktinfo3" autocomplete="off"/>
            <label for="vpProduktinfo3">VP Produktinfo 3</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="vpProduktinfo4" id="vpProduktinfo4" autocomplete="off"/>
            <label for="vpProduktinfo4">VP Produktinfo 4</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="block mt-2">
            <input pInputText formControlName="vpProduktinfo5" id="vpProduktinfo5" autocomplete="off"/>
            <label for="vpProduktinfo5">VP Produktinfo 5</label>
          </p-floatlabel>
        </div>

        <div class="w-full flex items-end">
          <p-button label="Suchen" class="w-full md:w-auto" />
        </div>
      </div>


    </form>
  </p-fieldset>

  <p-fieldset legend="Filterergebnis">
    <p-toolbar>
      <ng-template #start>
        <p-button icon="pi pi-plus" class="mr-2" text severity="secondary" (onClick)="onAddProvision()" />
        <p-button icon="pi pi-print" class="mr-2" text severity="secondary" />
        <p-button icon="pi pi-upload" class="mr-2" text severity="secondary" />
      </ng-template>
    </p-toolbar>
    <ag-grid-angular
      style="width: 100%; height: 450px"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [theme]=themeBalham
      (gridReady)="onGridReady($event)"
      (rowDoubleClicked)="onRowDoubleClick($event)"
    />
  </p-fieldset>

  <!-- Dialogs -->
  <app-provision-create [visible]="showCreateDialog()" (showCreateDialog)="showCreateDialog.set($event)" (showMessage)="showMessage($event)"/>
  <app-provision-edit [visible]="showEditDialog()" [provision]="selectedProvision()" (showEditDialog)="showEditDialog.set($event)" (showMessage)="showMessage($event)"/>
</div>
