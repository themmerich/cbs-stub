<p-dialog
  header="{{ 'provision.create.title' | translate }}"
  [modal]="true"
  [style]="{ width: '60rem', height: '30rem'}"
  [(visible)]="visible"
  (onShow)="resetForm()"
  (onHide)="cancel()"
>
  <app-provision-form (submitProvision)="create($event)" (cancelProvision)="cancel()" [provision]="provision()"/>
</p-dialog>
