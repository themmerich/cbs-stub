<div>
  <p-fieldset legend="Provisionskriterien" styleClass="m-4">
    <form [formGroup]="provisionForm" class="flex flex-col h-full">
      <div class="flex-1 overflow-auto p-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <app-form-input id="stichtag" [prefix]="'provision'" />
          <app-form-input id="kontonummer" [prefix]="'provision'" />
          <app-form-input id="geschaeftsnummer" [prefix]="'provision'" />
          <app-form-input id="erfassungsart" [prefix]="'provision'" />
          <app-form-input id="bezeichnung" [prefix]="'provision'" />
          <app-form-input id="kundennummer" [prefix]="'provision'" />
          <app-form-input id="beraternummer" [prefix]="'provision'" />
          <app-form-input id="neugeschaeft" [prefix]="'provision'" />
          <app-form-input id="vertriebsweg" [prefix]="'provision'" />
          <app-form-input id="waehrung" [prefix]="'provision'" />
          <app-form-input id="vpProduktinfo1" [prefix]="'provision'" />
          <app-form-input id="vpProduktinfo2" [prefix]="'provision'" />
          <app-form-input id="vpProduktinfo3" [prefix]="'provision'" />
          <app-form-input id="vpProduktinfo4" [prefix]="'provision'" />
          <app-form-input id="vpProduktinfo5" [prefix]="'provision'" />
        </div>
      </div>

      <div class="flex justify-end gap-2">
        <p-button label="Save" type="submit" disabled="{{ !(provisionForm.dirty && provisionForm.valid) }}" />
      </div>
    </form>
  </p-fieldset>

  <p-fieldset legend="Postenliste" styleClass="m-4">
    <p-toolbar>
      <ng-template #start>
        <p-button icon="pi pi-plus" class="mr-2" text severity="secondary" (onClick)="onAddPosten()" />
        <p-button icon="pi pi-print" class="mr-2" text severity="secondary" />
        <p-button icon="pi pi-upload" class="mr-2" text severity="secondary" />
      </ng-template>
    </p-toolbar>
    <ag-grid-angular
      style="width: 100%; height: 200px"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [columnTypes]="columnTypes"
      [pinnedBottomRowData]="pinnedBottomRowData()"
      [theme]=themeBalham
      (gridReady)="onGridReady($event)"
      (rowDoubleClicked)="onRowDoubleClick($event)"
    />
  </p-fieldset>
  <div class="flex justify-end gap-2 mr-4">
    <p-button label="Zurück" (onClick)="onGoBack()" />
  </div>

  <!-- Dialogs -->
  <app-posten-edit [visible]="showEditDialog()" [posten]="selectedPosten()" [postenListe]="provision()?.posten ?? []" (showEditDialog)="showEditDialog.set($event)" (showMessage)="showMessage($event)"/>
  <app-posten-create [visible]="showCreateDialog()" (showCreateDialog)="showCreateDialog.set($event)" (showMessage)="showMessage($event)"/>
</div>
