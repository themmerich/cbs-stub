<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full">
  <div class="flex-1 overflow-auto p-4">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <app-form-number id="aufwand" [prefix]="'posten'" [required]="true" />
      <app-form-number id="ertrag" [prefix]="'posten'" />
      <app-form-number id="volumen" [prefix]="'posten'" />
      <app-form-number id="umsatz" [prefix]="'posten'" />
      <app-form-number id="kosten" [prefix]="'posten'" />
      <app-form-number id="anzahl" [prefix]="'posten'" />
      <app-form-input id="aquisitionsweg" [prefix]="'posten'" />
      <app-form-input id="erfassungsart" [prefix]="'posten'" />
      <app-form-input id="gebuehrenart" [prefix]="'posten'" />
      <app-form-number id="individualprodukt" [prefix]="'posten'" />
      <app-form-input id="isinNummer" [prefix]="'posten'" />
      <app-form-number id="ordernummer" [prefix]="'posten'" />
      <app-form-input id="provisionstyp" [prefix]="'posten'" />
      <app-form-input id="sparte" [prefix]="'posten'" />
      <app-form-number id="standardprodukt" [prefix]="'posten'" />
      <app-form-input id="tarif" [prefix]="'posten'" />
      <app-form-number id="textschluesselgruppe" [prefix]="'posten'" />
      <app-form-input id="vpPostenidentifier1" [prefix]="'posten'" />
      <app-form-input id="vpPostenidentifier2" [prefix]="'posten'" />
      <app-form-input id="vpPostenidentifier3" [prefix]="'posten'" />
      <app-form-input id="vpPostenidentifier4" [prefix]="'posten'" />
      <app-form-input id="vpPostenidentifier5" [prefix]="'posten'" />
      <app-form-input id="wertpapierkennnummer" [prefix]="'posten'" />
      <app-form-input id="zuwachsvertrag" [prefix]="'posten'" />
    </div>

  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="onCancel()" />
    <p-button label="Save" type="submit" disabled="{{ !(form.dirty && form.valid) }}" />
  </div>
</form>
