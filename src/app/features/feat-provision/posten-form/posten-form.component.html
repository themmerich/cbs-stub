<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col h-full">
  <div class="flex-1 overflow-auto p-4 space-y-4">
      <!-- Fieldset 1: 2 rows × 3 columns -->
      <p-fieldset legend="Werte" class="w-full">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <!-- Row 1 -->
          <div><app-form-number id="aufwand" [prefix]="'posten'" [required]="true" /></div>
          <div><app-form-number id="ertrag" [prefix]="'posten'" /></div>
          <div><app-form-number id="volumen" [prefix]="'posten'" /></div>

          <!-- Row 2 -->
          <div><app-form-number id="umsatz" [prefix]="'posten'" /></div>
          <div><app-form-number id="kosten" [prefix]="'posten'" /></div>
          <div><app-form-number id="anzahl" [prefix]="'posten'" /></div>
        </div>
      </p-fieldset>

      <!-- Fieldset 2: stacked below, also 3 columns (will wrap into as many rows as needed) -->
      <p-fieldset legend="Kriterien" class="w-full">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div><app-form-input id="aquisitionsweg" [prefix]="'posten'" /></div>
          <div><app-form-input id="erfassungsart" [prefix]="'posten'" /></div>
          <div><app-form-input id="gebuehrenart" [prefix]="'posten'" /></div>

          <div><app-form-number id="individualprodukt" [prefix]="'posten'" /></div>
          <div><app-form-input id="isinNummer" [prefix]="'posten'" /></div>
          <div><app-form-number id="ordernummer" [prefix]="'posten'" /></div>

          <div><app-form-input id="provisionstyp" [prefix]="'posten'" /></div>
          <div><app-form-input id="sparte" [prefix]="'posten'" /></div>
          <div><app-form-number id="standardprodukt" [prefix]="'posten'" /></div>

          <div><app-form-input id="tarif" [prefix]="'posten'" /></div>
          <div><app-form-number id="textschluesselgruppe" [prefix]="'posten'" /></div>
          <div><app-form-input id="vpPostenidentifier1" [prefix]="'posten'" /></div>

          <div><app-form-input id="vpPostenidentifier2" [prefix]="'posten'" /></div>
          <div><app-form-input id="vpPostenidentifier3" [prefix]="'posten'" /></div>
          <div><app-form-input id="vpPostenidentifier4" [prefix]="'posten'" /></div>

          <div><app-form-input id="vpPostenidentifier5" [prefix]="'posten'" /></div>
          <div><app-form-input id="wertpapierkennnummer" [prefix]="'posten'" /></div>
          <div><app-form-input id="zuwachsvertrag" [prefix]="'posten'" /></div>
        </div>
      </p-fieldset>

  </div>

  <div class="flex items-center justify-between gap-2 p-4">
    <!-- left button group -->
    @if (size() > 0) {
      <div class="flex items-center gap-2">
        <!-- example: Reset and Duplicate buttons -->
        <p-button icon="pi pi-backward" [disabled]="index() === 0" (click)="onPrevious()" class="p-button-secondary"></p-button>
        <p-button icon="pi pi-forward" [disabled]="index() === size() - 1" (click)="onNext()" class="p-button-secondary"></p-button>
        Posten {{index() + 1}} von {{size()}}
      </div>
    }

    <!-- right button group -->
    <div class="flex items-center gap-2">
      <p-button label="Cancel" severity="secondary" type="button" (click)="onCancel()"></p-button>
      <p-button label="Save" type="submit" [disabled]="!(form.dirty && form.valid)"></p-button>
    </div>
  </div>
</form>
